[package]
name = "tapwheel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ab_glyph = "0.2.32"
bzip2 = "0.6"
chardetng = "0.1"
csv = "1"
dprint-plugin-typescript = "0.95"
encoding_rs = "0.8"
flate2 = "1.1.10"
half = "2"
html2text = "0.15"
htmd = "0.3"
icns = "0.3"
imagepipe = "0.5"
imagequant = "4.4.1"
jxl-oxide = "0.12"
kamadak-exif = "0.6"
lightningcss = { version = "1.0.0-alpha.67", default-features = false }
malva = "0.12"
markup_fmt = "0.22"
md-5 = "0.10"
minify-html = "0.16"
minify-js = "0.6"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "std"] }
png = "0.18.1"
pretty_yaml = "0.5"
psd = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
quick-xml = "0.38"
resvg = "0.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sevenz-rust2 = { version = "0.20.2", features = ["compress", "aes256"] }
sha1 = "0.10"
sha2 = "0.10"
sqlformat = "0.3"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
taplo = { version = "0.14", default-features = false }
tar = "0.4.46"
time = "0.3"
tiny-skia = "0.11"
toml = "1.1.8"
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
vtracer = "0.6"
xz2 = { version = "0.1", features = ["static"] }
zip = { version = "9", default-features = false, features = ["deflate", "aes-crypto", "time"] }
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Core", "Media_SpeechSynthesis", "Storage_Streams"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
