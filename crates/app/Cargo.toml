[package]
name = "tapwheel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Drag a file, tap a key, drop it on the wheel."

[dependencies]
tapwheel-core = { path = "../core" }
tapwheel-ui = { path = "../ui" }
tiny-skia = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Graphics_Dwm",
	"Win32_Graphics_Gdi",
	"Win32_Security",
	"Win32_Storage_Packaging_Appx",
	"Win32_System_Com",
	"Win32_System_DataExchange",
	"Win32_System_LibraryLoader",
	"Win32_System_Memory",
	"Win32_System_Ole",
	"Win32_System_Registry",
	"Win32_System_SystemInformation",
	"Win32_System_Threading",
	"Win32_UI_Accessibility",
	"Win32_UI_HiDpi",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Shell",
	"Win32_UI_Shell_Common",
	"Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation"] }

[build-dependencies]
tapwheel-ui = { path = "../ui" }
embed-resource = "3"
