name: CI

on:
  push:
    branches: [main, build]
  pull_request:
  workflow_call:
  workflow_dispatch:

# a newer push to a branch replaces its older run; main and tags always finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: never

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      site: ${{ steps.diff.outputs.site }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - id: diff
        run: .github/scripts/changes.sh
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}

  core:
    name: Core and UI (Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: .github/scripts/report.sh cargo fmt --all --check
      # FFmpeg 8.1, the line the Windows app ships, as a static build from GitHub: Ubuntu's package
      # mirror hung on most runs in October 2026. It's checked against the build's published SHA-256
      # and cached under it, so a run only downloads when a new 8.1 build comes out.
      - name: Find the FFmpeg build
        id: ffmpeg
        timeout-minutes: 2
        run: |
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          name=ffmpeg-n8.1-latest-linux64-gpl-8.1
          curl -fsSL --retry 3 --max-time 60 "$base/checksums.sha256" -o "$RUNNER_TEMP/ffmpeg.sha256"
          sum=$(awk -v f="$name.tar.xz" '$2 == f { print $1 }' "$RUNNER_TEMP/ffmpeg.sha256")
          if [ -z "$sum" ]; then echo "::error::$name.tar.xz is not in the build's checksums"; exit 1; fi
          { echo "base=$base"; echo "name=$name"; echo "sum=$sum"; } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: ffmpeg-cache
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-linux-${{ steps.ffmpeg.outputs.sum }}
      - name: Download FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --max-time 240 "${{ steps.ffmpeg.outputs.base }}/${{ steps.ffmpeg.outputs.name }}.tar.xz" -o ffmpeg.tar.xz
          echo "${{ steps.ffmpeg.outputs.sum }}  ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p ffmpeg
          tar -xJf ffmpeg.tar.xz --strip-components=2 -C ffmpeg "${{ steps.ffmpeg.outputs.name }}/bin/ffmpeg" "${{ steps.ffmpeg.outputs.name }}/bin/ffprobe"
          rm ffmpeg.tar.xz
      - run: ${{ runner.temp }}/ffmpeg/ffmpeg -hide_banner -version | head -n 1
      - run: .github/scripts/report.sh cargo clippy --workspace --all-targets -- -D warnings
      - run: .github/scripts/report.sh cargo test --workspace
        env:
          TAPWHEEL_FFMPEG: ${{ runner.temp }}/ffmpeg/ffmpeg
      - name: The website lists what the wheel offers
        run: |
          cargo run -q -p tapwheel-core --example site_data > /tmp/wheel.json
          diff -u site/public/data/wheel.json /tmp/wheel.json || { echo "::error file=site/public/data/wheel.json::Out of date. Run: cargo run -p tapwheel-core --example site_data > site/public/data/wheel.json"; exit 1; }

  # Windows minutes count double, so this job waits for the Linux checks and stops early when they fail.
  windows:
    name: App (Windows)
    needs: [changes, core]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache@v6
        with:
          path: target/engines
          key: engines-${{ hashFiles('engines/engines.toml', 'engines/model.py') }}
      - name: Fetch converters
        run: ./engines/fetch.ps1
      - name: Clippy
        shell: bash
        run: .github/scripts/report.sh cargo clippy --workspace --all-targets --message-format=short -- -D warnings
      - uses: taiki-e/install-action@nextest
      - name: Tests with the real converter
        shell: bash
        run: .github/scripts/report.sh cargo nextest run --workspace --profile ci --no-tests=warn
        env:
          TAPWHEEL_FFMPEG: ${{ github.workspace }}\target\engines\ffmpeg.exe
          TAPWHEEL_MODEL_DIR: ${{ github.workspace }}\target\engines
      # The release build and package run on main, tags and manual runs. A branch push starts the
      # debug build, which reuses what the tests compiled.
      - name: Build
        id: build
        shell: bash
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ] || [[ "$GITHUB_REF" == refs/tags/* ]] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "profile=release" >> "$GITHUB_OUTPUT"
            .github/scripts/report.sh cargo build --release
          else
            echo "profile=debug" >> "$GITHUB_OUTPUT"
            .github/scripts/report.sh cargo build
          fi
      - name: Start the app once
        run: |
          $p = Start-Process -FilePath "target\${{ steps.build.outputs.profile }}\tapwheel.exe" -ArgumentList "--smoke" -Wait -PassThru
          Get-Content "$env:TEMP\tapwheel-smoke.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke test exited with $($p.ExitCode)" }
      - name: Package
        if: steps.build.outputs.profile == 'release'
        run: ./packaging/package.ps1 -TestSigned
      - if: steps.build.outputs.profile == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: tapwheel-windows
          path: |
            dist/*.zip
            dist/*.msix
            dist/*.cer
          if-no-files-found: error

  site:
    name: Website and Markdown
    needs: changes
    if: needs.changes.outputs.site == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - if: needs.changes.outputs.docs == 'true'
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
      - if: needs.changes.outputs.site == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - if: needs.changes.outputs.site == 'true'
        run: npm install --no-save playwright@1
      # the browser's system libraries come through Ubuntu's package mirror
      - name: Install the browser
        if: needs.changes.outputs.site == 'true'
        timeout-minutes: 8
        run: |
          for try in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "::warning::installing the browser failed on try $try"
            sleep 10
          done
          exit 1
      - if: needs.changes.outputs.site == 'true'
        run: node site/check.mjs
