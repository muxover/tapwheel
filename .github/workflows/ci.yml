name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: never

jobs:
  core:
    name: Core and UI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: .github/scripts/report.sh cargo fmt --all --check
      - run: .github/scripts/report.sh cargo clippy --workspace --all-targets -- -D warnings
      - run: .github/scripts/report.sh cargo test --workspace

  windows:
    name: App (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: target/engines
          key: engines-${{ hashFiles('engines/engines.toml') }}
      - name: Fetch converters
        run: ./engines/fetch.ps1
      - name: Clippy
        shell: bash
        run: .github/scripts/report.sh cargo clippy --workspace --all-targets --message-format=short -- -D warnings
      - name: Tests with the real converter
        shell: bash
        run: .github/scripts/report.sh cargo test --workspace
        env:
          TAPWHEEL_FFMPEG: ${{ github.workspace }}\target\engines\ffmpeg.exe
      - name: Build
        shell: bash
        run: .github/scripts/report.sh cargo build --release
      - name: Start the app once
        run: |
          $p = Start-Process -FilePath target\release\tapwheel.exe -ArgumentList "--smoke" -Wait -PassThru
          Get-Content "$env:TEMP\tapwheel-smoke.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke test exited with $($p.ExitCode)" }
      - name: Package
        run: ./packaging/package.ps1 -TestSigned
      - uses: actions/upload-artifact@v7
        with:
          name: tapwheel-windows
          path: |
            dist/*.zip
            dist/*.msix
            dist/*.cer
          if-no-files-found: error

  site:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node site/check.mjs

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
