[workspace]
resolver = "3"
members = ["crates/core", "crates/ui", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/muxover/tapwheel"
rust-version = "1.93"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
