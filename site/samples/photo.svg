    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a8f"/><stop offset="1" stop-color="#c47a83"/></linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d3566"/><stop offset="1" stop-color="#7a4a6b"/></linearGradient>
